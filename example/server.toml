### Required

# Address and port to listen on. A hostname works too.
listen = "0.0.0.0:5258"

# Keys that, pressed together, hand control to the next machine.
# See `switch-keys.md` for every name you can use here.
switch-keys = ["left-alt", "left-ctrl"]

# TLS certificate and private key, generated with rkvm-certificate-gen.
certificate = "/etc/rkvm/certificate.pem"
key = "/etc/rkvm/key.pem"

# Clients have to know this to connect. Change it before deploying.
password = "123456789"

### Optional

# Whether the switch keys also reach the machine being controlled.
# Individual switch keys keep working as normal keys either way.
# propagate-switch-keys = true

# Devices whose name contains any of these are never taken over.
# Case insensitive, matched on a substring.
# ignore-devices = ["Wacom", "SteelSeries"]

# Lights the caps lock LED up while another machine is being controlled.
# Either "none" or "caps-lock".
# indicator = "caps-lock"

# Command to run on every switch, through sh.
# The target's name is in $1 and in $RKVM_TARGET.
# on-switch = "notify-send rkvm \"now on $RKVM_TARGET\""

### Optional, and has to stay at the end of the file
### Everything below a [table] header belongs to that table.

# Shortcuts that jump straight to one machine instead of cycling.
# "server" means this machine, any other name matches a client's `name`.
# [switch-to]
# server = ["left-alt", "esc"]
# laptop = ["left-alt", "f1"]

# Clipboard sharing. All three commands run through sh,
# and {type} is replaced with the MIME type being copied.
# [clipboard]
# list-types = "wl-paste --list-types"
# read = "wl-paste --no-newline --type {type}"
# write = "wl-copy --type {type}"
