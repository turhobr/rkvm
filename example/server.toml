# Either an address or a hostname, with a port.
listen = "0.0.0.0:5258"
# See `switch-keys.md` in the repository root for the list of all possible keys.
switch-keys = ["left-alt", "left-ctrl"]
# Optional per client shortcuts, jumping straight to one machine instead of cycling.
# The name "server" means this machine, everything else matches a client's `name`.
# [switch-to]
# server = ["left-alt", "escape"]
# laptop = ["left-alt", "f1"]

# Whether the switch key combination should be propagated on the server and its clients.
# Individual switch keys still work as normal keys either way, only the completed
# combination is withheld when this is false.
# Optional, defaults to true.
# propagate-switch-keys = true
# Light up the caps lock LED while another machine is being controlled.
# Either "none" (default) or "caps-lock".
# indicator = "caps-lock"

# Optional command to run on every switch, with the target's name in $1 and $RKVM_TARGET.
# on-switch = "notify-send rkvm \"now on $RKVM_TARGET\""

certificate = "/etc/rkvm/certificate.pem"
key = "/etc/rkvm/key.pem"

# This is to prevent malicious clients from connecting to the server.
# Make sure this matches your client's config.
#
# Change this to your own value before deploying rkvm.
password = "123456789"
